name: "SDLC Upload Config"
description: "Reads sdlc.yml from the repo and uploads it to the SDLC platform Storage via the control plane API."

inputs:
  env:
    description: "Environment to target (dev or prod)"
    required: false
    default: "dev"
  config-path:
    description: "Path to sdlc.yml relative to repo root"
    required: false
    default: "sdlc-config/sdlc.yml"

runs:
  using: "composite"
  steps:
    - name: Read platform config
      shell: bash
      run: |
        API_URL=$(python3 -c "import yaml; c=yaml.safe_load(open('${{ github.action_path }}/../config/platform.yml')); print(c['${{ inputs.env }}']['api_url'])")
        echo "API_URL=$API_URL" >> $GITHUB_ENV
        echo "Using API: $API_URL"

    - name: Get OIDC token
      shell: bash
      run: |
        TOKEN=$(curl -sf \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sdlc-control-plane" \
          | jq -r '.value')

        if [ -z "$TOKEN" ]; then
          echo "Failed to get OIDC token"
          exit 1
        fi

        echo "TOKEN=$TOKEN" >> $GITHUB_ENV
        echo "OIDC token obtained"

    - name: Upload sdlc.yml to SDLC platform
      shell: bash
      run: |
        CONFIG_FILE="${{ inputs.config-path }}"

        if [ ! -f "$CONFIG_FILE" ]; then
          echo "Error: $CONFIG_FILE not found"
          exit 1
        fi

        echo "Uploading $CONFIG_FILE to SDLC platform..."

        RESPONSE=$(curl -s -w "\n%{http_code}" \
          -X POST "${{ env.API_URL }}/tenant/upload_sdlc" \
          -H "Authorization: Bearer ${{ env.TOKEN }}" \
          -H "Content-Type: application/x-yaml" \
          --data-binary @"$CONFIG_FILE")

        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | head -1)

        echo "Response: $BODY"
        echo "HTTP status: $HTTP_CODE"

        if [ "$HTTP_CODE" != "200" ]; then
          echo "Error: expected HTTP 200, got $HTTP_CODE"
          exit 1
        fi

        echo "sdlc.yml queued — worker will save to Storage"
