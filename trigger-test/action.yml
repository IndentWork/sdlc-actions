name: "SDLC Trigger Test"
description: "Validates the end-to-end flow — Service Bus → Worker → Storage. Uses GitHub OIDC to identify the tenant."

inputs:
  env:
    description: "Environment to target (dev or prod)"
    required: false
    default: "dev"

runs:
  using: "composite"
  steps:
    - name: Read platform config
      shell: bash
      run: |
        # Read API URL from central platform.yml — one place to update when URLs change.
        # Python one-liner avoids indentation issues inside YAML block scalar.
        API_URL=$(python3 -c "import yaml; c=yaml.safe_load(open('${{ github.action_path }}/../config/platform.yml')); print(c['${{ inputs.env }}']['api_url'])")
        echo "API_URL=$API_URL" >> $GITHUB_ENV
        echo "Using API: $API_URL"

    - name: Get OIDC token and trigger test
      shell: bash
      run: |
        # Request a short-lived OIDC token from GitHub.
        # The token contains repository_owner (org name) which the API uses to identify the tenant.
        TOKEN=$(curl -sf \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sdlc-control-plane" \
          | jq -r '.value')

        if [ -z "$TOKEN" ]; then
          echo "Failed to get OIDC token"
          exit 1
        fi

        echo "OIDC token obtained — calling test_storage endpoint"

        RESPONSE=$(curl -s -w "\n%{http_code}" \
          "${{ env.API_URL }}/tenant/test_storage" \
          -H "Authorization: Bearer $TOKEN")

        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | head -1)

        echo "Response: $BODY"
        echo "HTTP status: $HTTP_CODE"

        if [ "$HTTP_CODE" != "200" ]; then
          echo "Error: expected HTTP 200, got $HTTP_CODE"
          exit 1
        fi

        echo "Test triggered successfully — worker will create hello.txt in Storage"
