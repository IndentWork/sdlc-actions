name: "SDLC Trigger Test"
description: "Validates the end-to-end flow — Service Bus → Worker → Storage. Uses GitHub OIDC to identify the tenant."

inputs:
  api-url:
    description: "SDLC Control Plane API URL"
    required: true

runs:
  using: "composite"
  steps:
    - name: Get OIDC token and trigger test
      shell: bash
      run: |
        # Request a short-lived OIDC token from GitHub.
        # The token contains repository_owner (org name) which the API uses to identify the tenant.
        TOKEN=$(curl -sf \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sdlc-control-plane" \
          | jq -r '.value')

        if [ -z "$TOKEN" ]; then
          echo "Failed to get OIDC token"
          exit 1
        fi

        echo "OIDC token obtained — calling test_storage endpoint"

        RESPONSE=$(curl -s -w "\n%{http_code}" \
          "${{ inputs.api-url }}/tenant/test_storage" \
          -H "Authorization: Bearer $TOKEN")

        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | head -1)

        echo "Response: $BODY"
        echo "HTTP status: $HTTP_CODE"

        if [ "$HTTP_CODE" != "200" ]; then
          echo "Error: expected HTTP 200, got $HTTP_CODE"
          exit 1
        fi

        echo "Test triggered successfully — worker will create hello.txt in Storage"
